name: Market Reader Daily

on:
  workflow_dispatch:

  schedule:
    # 한국시간 오전 7:00
    # UTC 전날 22:00
    - cron: "0 22 * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Check secrets
        env:
          KOREAEXIM_EXCHANGE_API_KEY: ${{ secrets.KOREAEXIM_EXCHANGE_API_KEY }}
          KOREAEXIM_INTEREST_API_KEY: ${{ secrets.KOREAEXIM_INTEREST_API_KEY }}
        run: |
          if [ -n "$KOREAEXIM_EXCHANGE_API_KEY" ]; then
            echo "EXCHANGE KEY: OK"
            echo "EXCHANGE KEY LENGTH: ${#KOREAEXIM_EXCHANGE_API_KEY}"
          else
            echo "EXCHANGE KEY: EMPTY"
          fi

          if [ -n "$KOREAEXIM_INTEREST_API_KEY" ]; then
            echo "INTEREST KEY: OK"
            echo "INTEREST KEY LENGTH: ${#KOREAEXIM_INTEREST_API_KEY}"
          else
            echo "INTEREST KEY: EMPTY"
          fi

      - name: Generate and email
        env:
          MAIL_SENDER: ${{ secrets.MAIL_SENDER }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_RECIPIENT: ${{ secrets.MAIL_RECIPIENT }}

          KOREAEXIM_EXCHANGE_API_KEY: ${{ secrets.KOREAEXIM_EXCHANGE_API_KEY }}
          KOREAEXIM_INTEREST_API_KEY: ${{ secrets.KOREAEXIM_INTEREST_API_KEY }}

          FFMPEG_PATH: /usr/bin/ffmpeg

        run: python main.py