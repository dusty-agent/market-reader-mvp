<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=1080, height=1920, initial-scale=1.0"
  >

  <title>MarketReader | Ending</title>

  <style>
    {{ENDING_CSS}}
  </style>

</head>

<body>

  <main class="page">

    <div class="safe">

      <div class="ending-wrap">


        <!-- =====================================
             BRAND
        ====================================== -->

        <div class="marketreader-brand">

          MarketReader

          <span class="brand-arrow">
            ↑
          </span>

        </div>


        <div class="marketreader-label">
          DAILY MARKET BOARD
        </div>


        <!-- =====================================
             EYEBROW
        ====================================== -->

        <div class="ending-eyebrow">
          SEE YOU TOMORROW MORNING
        </div>


        <!-- =====================================
             TITLE
        ====================================== -->

        <h1 class="ending-title">

          내일도<br>

          <span class="gold">
            Market Reader
          </span>

          가<br>

          찾아옵니다.

        </h1>


        <!-- =====================================
             CTA
        ====================================== -->

        <div class="ending-actions">


          <!-- LIKE -->

          <div class="ending-action">

            <div class="ending-action-icon">
              ♡
            </div>

            <span>
              좋아요
            </span>

          </div>


          <!-- SUBSCRIBE -->

          <div class="ending-action subscribe">

            <div class="ending-action-icon">
              ▶
            </div>

            <span>
              구독
            </span>

          </div>


          <!-- NOTIFICATION -->

          <div class="ending-action">

            <div class="ending-action-icon bell">
              🔔
            </div>

            <span>
              알림 설정
            </span>

          </div>


        </div>


        <!-- =====================================
             DESCRIPTION
        ====================================== -->

        <div class="ending-description">

          매일의 시장 변화를<br>

          마켓리더 전광판에서 확인해보세요.

        </div>


        <!-- =====================================
             DIVIDER
        ====================================== -->

        <div class="ending-divider"></div>


        <!-- =====================================
             BOTTOM
        ====================================== -->

        <div class="ending-bottom">

          내일 아침에 다시 만나요.

        </div>


      </div>


      <!-- =====================================
           FOOTER
      ====================================== -->

      <footer class="footer">

        <div class="assetpicker">
          Asset Picker
        </div>

        <div>
          Powered by
          <br>
          <strong>
            Dustie
          </strong>
        </div>

        <div>
          © AssetPicker
          <br>
          Built with DustyDraft
        </div>

      </footer>


    </div>

  </main>

</body>

</html>
